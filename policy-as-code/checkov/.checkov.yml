# Checkov Policy Configuration for Pune ESG Cloud Security CI/CD Gate
directory:
  - terraform

framework:
  - terraform

# Fail pipeline on HIGH or CRITICAL severity policy violations
soft-fail: false
compact: true
quiet: false

check:
  # S3 Checks
  - CKV_AWS_18   # Ensure S3 bucket access logging is enabled
  - CKV_AWS_19   # Ensure all data stored in S3 is encrypted at rest
  - CKV_AWS_21   # Ensure S3 bucket versioning is enabled
  - CKV_AWS_53   # Ensure S3 bucket has Block Public Access settings enabled
  - CKV_AWS_54   # Ensure S3 bucket has BlockPublicAcls enabled
  - CKV_AWS_55   # Ensure S3 bucket has IgnorePublicAcls enabled
  - CKV_AWS_56   # Ensure S3 bucket has RestrictPublicBuckets enabled
  - CKV_AWS_145  # Ensure S3 bucket uses KMS Customer Managed Key
  - CKV_AWS_144  # Ensure S3 bucket has TLS enforcement policy

  # IAM Checks
  - CKV_AWS_10   # Ensure IAM password policy requires minimum 14 characters
  - CKV_AWS_11   # Ensure IAM password policy expires passwords within 90 days
  - CKV_AWS_12   # Ensure IAM password policy prevents password reuse
  - CKV_AWS_14   # Ensure IAM password policy requires numbers and symbols
  - CKV_AWS_60   # Ensure IAM policy does not allow full '*' administrative privileges

  # Network & Compute Checks
  - CKV_AWS_24   # Ensure Security Group does not allow ingress 0.0.0.0/0 to port 22 (SSH)
  - CKV_AWS_25   # Ensure Security Group does not allow ingress 0.0.0.0/0 to port 3389 (RDP)
  - CKV_AWS_260  # Ensure Security Group ingress is not open to entire internet
  - CKV_AWS_2    # Ensure VPC Flow Logs are enabled

  # Database Checks
  - CKV_AWS_16   # Ensure RDS database is encrypted at rest
  - CKV_AWS_17   # Ensure RDS database is not publicly accessible
  - CKV_AWS_157  # Ensure Multi-AZ is enabled for RDS instances
  - CKV_AWS_118  # Ensure RDS enhanced monitoring is enabled
  - CKV_AWS_133  # Ensure RDS deletion protection is enabled

  # Logging & Detection Checks
  - CKV_AWS_35   # Ensure CloudTrail is enabled across all regions
  - CKV_AWS_36   # Ensure CloudTrail log file validation is enabled
  - CKV_AWS_67   # Ensure CloudTrail is encrypted with KMS
  - CKV_AWS_238  # Ensure AWS GuardDuty is enabled
